syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PlayerCookReqOuterClass";

// 7.1 writer IENGFLPCLNM 0x1510d35e0, both cook sites in COIIDNIOFGL.
// Field 1 is the QTE quality: manual cooks send 1/2/3, an auto cook omits it.
// Field 4 is the cook count: a manual cook always sends 1, an auto cook sends the slider.
// Fields 7 and 10 are the two context uints copied from the cooking controller at +0x24c
// and +0x25c. The 7.0 names stay in historical field-number order; which name belongs to
// which controller offset was not re-proven, and the server only logs them.
message PlayerCookReq {
	uint32 JJPABEHGMCH = 1;
	uint32 KLACBPCPCMJ = 4;
	uint32 assist_avatar = 6;
	uint32 DDACKLBMIKL = 7;
	uint32 OLLOPKLIIAC = 10;
	uint32 recipe_id = 14;
}
