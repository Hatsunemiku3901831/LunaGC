// 7.1 native UseItemRsp: opcode 25449, parser 0x148005ad0, uint32 list codec 0x148005da0.
// Consumer 0x14b154bb0 forwards GUID, item ID, target GUID and scalar choice on success.
syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "UseItemRspOuterClass";

message UseItemRsp {
	uint64 target_guid = 12;
	int32 retcode = 4;
	uint32 item_id = 5;
	uint32 option_idx = 14;
	uint64 guid = 1;
	repeated uint32 _option_idx_list = 9;
}
