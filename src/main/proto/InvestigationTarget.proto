syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "InvestigationTargetOuterClass";

message InvestigationTarget {
  enum State {
    INVALID = 0;
    IN_PROGRESS = 1;
    COMPLETE = 2;
    REWARD_TAKEN = 3;
  }

  uint32 investigation_id = 5;
  uint32 quest_id = 8;
  State state = 6;
  uint32 progress = 2;
  uint32 total_progress = 13;
}
