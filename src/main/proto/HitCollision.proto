syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "HitCollisionOuterClass";

import "HitColliderType.proto";
import "Vector.proto";

message HitCollision {
	// 7.1 type 65988, parser 0x14ba41710.
	reserved 50000 to 50002;
	reserved "OMEMJMGDNPP", "PFLEHLDGODB", "EGIAGADINML";
	float NJKLJHDFGMG = 1;
	HitColliderType hit_collider_type = 5;
	Vector hit_point = 9;
	float FHFGJMFHCIJ = 11;
	Vector hit_dir = 12;
	float EIHNKFAPOGM = 13;
	int32 hit_box_index = 15;
}
