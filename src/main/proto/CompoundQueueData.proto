syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "CompoundQueueDataOuterClass";

// Verified parser 0x1530f1e50 and controller 0x14c27da00.
// Local EMEJJDAGKBL feeds MonoBagProxySlot.RefreshCompoundItem 0x14fe9f4c0.
message CompoundQueueData {
  uint32 output_time = 1;
  uint32 wait_count = 2;
  uint32 output_count = 7;
  uint32 compound_id = 10;
}
