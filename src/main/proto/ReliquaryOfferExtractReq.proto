syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ReliquaryOfferExtractReqOuterClass";

import "ItemParam.proto";

message ReliquaryOfferExtractReq {
  uint32 schedule_id = 1;
  repeated uint64 reliquary_guid_list = 5;
  repeated ItemParam item_list = 8;
}
