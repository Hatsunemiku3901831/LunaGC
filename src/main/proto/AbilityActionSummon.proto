syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AbilityActionSummonOuterClass";

import "Vector.proto";

message AbilityActionSummon {
	// 7.1 GEPFCBAPAMC; writer 0x1535fd5d0, native Summon sender 0x14c1657c0.
	Vector pos = 1;
	Vector rot = 4;
}
