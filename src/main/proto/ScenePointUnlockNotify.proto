syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ScenePointUnlockNotifyOuterClass";

// 7.1 reader NLGBJEEJDLG 0x15255c3e0. A normal unlock only fills scene_id and point_list.
// Field 4 locks, field 6 hides, field 8 unhides. Filling those on an unlock makes the
// client treat the same point as locked again.
message ScenePointUnlockNotify {
	uint32 scene_id = 2;
	repeated uint32 locked_point_list = 4;
	repeated uint32 hide_point_list = 6;
	repeated uint32 unhide_point_list = 8;
	repeated uint32 point_list = 15;
}
