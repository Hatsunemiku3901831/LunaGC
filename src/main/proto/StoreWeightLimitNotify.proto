// Generated from fixed CN72 inventory capacity consumers; server purpose alias.
// Three unconsumed fields retain raw names; enum uses its verified int32 storage.
syntax = "proto3";
option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "StoreWeightLimitNotifyOuterClass";

message StoreWeightLimitNotify {
  uint32 reliquary_count_limit = 1;
  uint32 PAKLDABINMP = 2;
  uint32 ADCHFHMCOJG = 4;
  uint32 furniture_count_limit = 5;
  int32 store_type = 6;
  uint32 DECHDEGPBOE = 7;
  uint32 weapon_count_limit = 9;
  uint32 material_count_limit = 14;
}
