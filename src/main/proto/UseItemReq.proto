// 7.1 native UseItemReq: opcode 25681, writer 0x14e55e840, uint32 list codec 0x14e55e5b0.
// Native sender 0x1507e0c90 copies one one-based choice per used box; route 0x14b1617b0 sets count to list length.
syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "UseItemReqOuterClass";

message UseItemReq {
	uint32 option_idx = 15;
	uint32 count = 9;
	uint64 target_guid = 14;
	uint64 guid = 3;
	bool is_enter_mp_dungeon_team = 1;
	repeated uint32 _option_idx_list = 7;
}
