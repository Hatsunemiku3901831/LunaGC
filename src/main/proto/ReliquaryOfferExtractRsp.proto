syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ReliquaryOfferExtractRspOuterClass";

import "ItemParam.proto";

message ReliquaryOfferExtractRsp {
  repeated ItemParam item_list = 3;
  int32 retcode = 5;
  repeated uint64 reliquary_guid_list = 6;
  uint32 schedule_id = 12;
}
