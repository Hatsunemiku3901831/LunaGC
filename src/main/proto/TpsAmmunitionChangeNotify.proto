syntax = "proto3";
option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "TpsAmmunitionChangeNotifyOuterClass";
// ONMCNLDIGJK / BOOHJPLDHBO. Count semantics remain a client validation item.
message TpsAmmunitionChangeNotify {
  repeated TpsAmmunitionChangeNotifyEntry ammunition_list = 6;
}
message TpsAmmunitionChangeNotifyEntry {
  int32 change_count = 4;
  uint32 ammunition_config_id = 8;
}
