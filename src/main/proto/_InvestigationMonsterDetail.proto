syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_InvestigationMonsterDetailOuterClass";

import "Vector.proto";
import "WeeklyBossResinDiscountInfo.proto";
import "_InvestigationMonsterConfig.proto";

message _InvestigationMonsterDetail {
	// 7.1 MIJPIIBGGIM writer 0x14fdc4f10. Shared LKNNIKGEEOH/MIDGFKJJPAE are boss counters.
	uint32 max_boss_chest_num = 9;
	bool is_alive = 3;
	bool _is_respawning = 15;
	uint32 refresh_interval = 4;
	uint32 resin = 2;
	uint32 next_refresh_time = 8;
	uint32 boss_chest_num = 6;
	bool is_area_locked = 1;
	uint32 level = 11;
	uint32 _map_layer_id = 10;
	WeeklyBossResinDiscountInfo weekly_boss_resin_discount_info = 13;
	uint32 next_boss_chest_refresh_time = 5;
	_InvestigationMonsterConfig _monster_config = 12;
	Vector pos = 7;
}
