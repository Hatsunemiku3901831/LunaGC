syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "TowerLevelEndNotifyOuterClass";

import "ItemParam.proto";

message TowerLevelEndNotify {
	repeated uint32 finished_star_cond_list = 15;
	// 7.1 PPFBGNHJIPE reader 0x14f51da20; consumed by DADDHGKEGGE.KKJPJBBPADB.
	uint32 next_floor_id = 3;
	uint32 continue_state = 8;
	repeated ItemParam reward_item_list = 9;
	bool is_success = 14;
}
