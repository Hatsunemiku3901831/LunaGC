# ---------------------------------------------------------------------------
#  LunaGC 7.1.0 task runner.
#
#  Common workflows:
#
#    task                 -> this list
#    task build           -> build the patch DLL and the server jar
#    task serve           -> build and start the persistent Docker Compose runtime
#    task dev:server      -> start the local Java development server
#    task patch           -> install the client patch (builds first if needed)
#    task patch:status    -> show which client files are patched right now
#    task patch:reset     -> restore the pristine client files
#    task dev             -> instrumented play session: server in -dev mode,
#                            the client, and the detached monitor that records
#                            crashes, unhandled packets and server errors
#    task dev:stop        -> close the game and write the session report
#    task dev:report      -> print the latest session report
#
#  On this machine `task` runs commands through sh (Git Bash), not cmd, so
#  every command below is one of: a .bat through `cmd /c`, a PowerShell script
#  file, a native exe (cargo / java), or another task. Never a bare $ variable
#  and never a path with an unquoted backslash -- sh expands both.
#
#  Commands are deliberately explicit rather than shell one-liners: the Windows
#  quoting rules differ per interpreter, and a command that works in a Git Bash
#  prompt silently breaks in Taskfile (and the reverse), so each step that
#  touches the interpreter boundary lives in its own script under tools/.
# ---------------------------------------------------------------------------
version: '3'

dotenv:
  - .env.local
  - .env

vars:
  # Directory that contains YuanShen.exe. Empty means "ask the launcher
  # registry", which is what .env ships with; see tools/game_path.ps1.
  GAME_PATH: '{{ .GAME_PATH | default "" }}'

  # The patch crate builds a cdylib named ext.dll; the server jar is named
  # after the gradle project version. Both are referenced by more than one
  # task, so they are resolved once here.
  PATCH_DLL: patch/target/release/ext.dll
  SERVER_JAR: '{{ .LUNAGC_JAR | default "LunaGC-7.1.0.jar" }}'

tasks:
  default:
    desc: Show the available tasks
    cmds:
      - task --list

  refs:sync:
    desc: Download public reference repositories and submodules into debug/
    cmds:
      - python tools/sync_debug_references.py

  refs:update:
    desc: Fast-forward clean reference checkouts and refresh debug/references.json
    cmds:
      - python tools/sync_debug_references.py --update

  refs:miliastra-catalog:
    desc: Extract literal Miliastra node metadata from the downloaded reference
    cmds:
      - python tools/extract_miliastra_catalog.py

  refs:miliastra-blocks:
    desc: Extract literal Miliastra block palette from the downloaded reference
    cmds:
      - python tools/extract_miliastra_blocks.py

  refs:miliastra-protocol:
    desc: Extract literal Miliastra protocol type and node rules from the pinned reference
    cmds:
      - python tools/extract_miliastra_protocol.py

  refs:miliastra-assets:
    desc: 从固定参考库提取 MIT 实体与镜头资产协议
    cmds:
      - python tools/extract_miliastra_assets.py

  refs:miliastra-cameras:
    desc: 从固定参考库提取五种镜头模板字面量
    cmds:
      - python tools/extract_miliastra_cameras.py

  # ------------------------------------------------------------------ build
  build:
    desc: Build the patch DLL and the server jar
    deps: [build:patch, build:jar]

  build:patch:
    desc: Build the Rust client patch (patch/target/release/ext.dll)
    dir: patch
    # Sources/generates make this a no-op when nothing changed, which matters
    # because `task patch` depends on it and would otherwise rebuild the DLL
    # on every invoke.
    sources:
      - src/**/*.rs
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - server_public_key.bin
      - sdk_public_key.xml
    generates:
      - target/release/ext.dll
    cmds:
      - cargo build --release

  build:jar:
    desc: Build the LunaGC server jar
    # timestamp, not checksum: generated Java lives in build/ and is rebuilt
    # from the checked-in proto sources.
    method: timestamp
    sources:
      - src/main/**/*.java
      - src/main/proto/**/*.proto
      - src/main/resources/**
      - build.gradle
      - settings.gradle
    generates:
      - '{{ .SERVER_JAR }}'
    cmds:
      # gradlew is a .bat, so it goes through cmd. The leading .\ matters:
      # `cmd /c gradlew.bat` does not search the working directory, but
      # `cmd /c .\gradlew.bat` does, and the bare-name form fails.
      - cmd: cmd /c ".\\gradlew.bat jar -PskipHandbook=1 --console=plain"

  # ------------------------------------------------------------------- serve
  serve:
    desc: Build and start the persistent Docker Compose runtime
    cmds:
      - task: runtime

  serve:stop:
    desc: Stop the Compose game service (MongoDB and volumes are retained)
    cmds:
      - task: runtime:stop

  serve:status:
    desc: Show Compose runtime health and published ports
    cmds:
      - task: runtime:status

  serve:logs:
    desc: Follow the Compose game service logs (Ctrl-C stops following only)
    cmds:
      - task: runtime:logs

  runtime:
    desc: Build the server and resources image, then start Compose detached and wait for health
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/runtime.ps1 -Mode start

  runtime:build:
    desc: Build the Compose runtime image without restarting the service
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/runtime.ps1 -Mode build

  runtime:stop:
    desc: Stop the Compose game service while retaining MongoDB and persistent state
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/runtime.ps1 -Mode stop

  runtime:status:
    desc: Show Compose runtime health and published ports
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/runtime.ps1 -Mode status

  runtime:logs:
    desc: Follow the Compose game service logs (Ctrl-C stops following only)
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/runtime.ps1 -Mode logs

  dev:server:
    desc: Start the local Java development server and shared Compose MongoDB
    deps: [build:jar]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/serve.ps1 -Mode start

  dev:server:stop:
    desc: Stop the local Java development server (MongoDB keeps running)
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/serve.ps1 -Mode stop

  dev:server:status:
    desc: Show the local Java development server status
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/serve.ps1 -Mode status

  runtime:snapshot:
    desc: 保存当前 Compose 服务的运行包和内置资源，不停止服务
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/runtime_snapshot.ps1 -Mode capture

  runtime:snapshot:build:
    desc: 从已有快照构建本地恢复镜像，并核对启动配置
    requires:
      vars: [SNAPSHOT_PATH]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/runtime_snapshot.ps1 -Mode build -SnapshotPath "{{ .SNAPSHOT_PATH }}"

  runtime:snapshot:status:
    desc: 显示已有运行快照及恢复镜像
    requires:
      vars: [SNAPSHOT_PATH]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/runtime_snapshot.ps1 -Mode status -SnapshotPath "{{ .SNAPSHOT_PATH }}"

  # ------------------------------------------------------------------ patch
  patch:
    desc: Install the client patch (builds the patch DLL first if it is stale)
    deps: [build:patch]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/patch_game.ps1 -Mode apply

  patch:status:
    desc: Show which client files are patched and whether pristine backups exist
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/patch_game.ps1 -Mode status

  patch:reset:
    desc: Restore the pristine client files from their backups
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/client_patch_guard.ps1 -Mode stop
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/patch_game.ps1 -Mode reset

  patch:check:
    desc: Check and repair the client patch once (defers changes while the game runs)
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/client_patch_guard.ps1 -Mode check

  patch:guard:
    desc: Check the client patch and start its independent background recovery guard
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/client_patch_guard.ps1 -Mode start

  patch:guard:status:
    desc: Show client patch guard heartbeat and last recovery result
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/client_patch_guard.ps1 -Mode status

  patch:guard:stop:
    desc: Stop client patch monitoring without stopping the game or Compose
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/client_patch_guard.ps1 -Mode stop

  # -------------------------------------------------------------- game path
  game-path:
    desc: Print the resolved game install directory
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/game_path.ps1

  # -------------------------------------------------------------------- dev
  dev:
    # The monitor lives in a detached hidden process that outlives this shell;
    # the build dep only matters when this task is the one starting the server,
    # but it is cheap when the jar is current and keeps a bare `task dev` from
    # silently launching a stale server.
    desc: Start an instrumented session (server -dev + client + monitor)
    deps: [build:jar]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/dev.ps1 -Mode start

  dev:stop:
    desc: Close the game and write the session report
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/dev.ps1 -Mode stop

  dev:status:
    desc: Show whether a session is being recorded, and the server state
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/dev.ps1 -Mode status

  dev:report:
    desc: Print the latest dev session report
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/dev.ps1 -Mode report
